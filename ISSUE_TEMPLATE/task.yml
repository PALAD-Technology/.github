name: Task
description: A defined piece of work to assign to an agent
labels: [task]
body:
  - type: textarea
    id: task
    attributes:
      label: Task
      description: What needs doing, in enough detail that an agent can start without asking.
    validations:
      required: true
  - type: textarea
    id: done
    attributes:
      label: Done when
      placeholder: |
        - [ ]
        - [ ]
    validations:
      required: true
  - type: textarea
    id: limits
    attributes:
      label: Out of scope / constraints
      description: Files not to touch, dependencies not to add, deadlines.
